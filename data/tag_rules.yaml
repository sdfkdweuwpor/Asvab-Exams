  specific_detail:      ['according to the passage', 'the passage states', 'which of the following is (true|mentioned)']
  inference:            ['can be inferred', 'suggests that', 'implies', 'most likely', 'the author would probably']
  vocabulary_in_context: ['as used in the passage', 'the word .* in the passage means', 'in line \d']
  author_purpose:       ["author'?s purpose", 'the author wrote', 'in order to (show|explain|persuade)', 'tone of the passage']

