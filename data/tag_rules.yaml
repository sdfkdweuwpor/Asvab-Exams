# Topic tagging rules. Editable by hand; scripts/tag_review.py appends here.
#
# The topic IDs below are EXACTLY the 64 already declared in
# config/test-config.json and already carried by the 64 lessons in
# lessons/lessons.json. Do not invent new IDs without adding a lesson or
# accepting the topic into the "uncovered" list in the coverage report --
# a tag with no lesson behind it makes "Open lesson" a dead end.
#
# Matching: case-insensitive regex against stem + options. First subtest is
# fixed by extraction; only that subtest's rules are considered. An item may
# take several topics; the first match orders them.

version: 1

AR:
  rate_time_distance:   ['\bmph\b', 'miles per hour', '\bspeed\b', 'how (far|long|fast)', 'travel(s|led|ing)?\b', '\bdistance\b']
  percentages_discount: ['%', 'percent', 'discount', 'sale price', 'markup', 'marked down', 'tax\b', 'tip\b']
  ratio_proportion:     ['\bratio\b', 'proportion', 'for every', '\bscale\b', '\d\s*:\s*\d']
  simple_interest:      ['interest', 'principal', 'per annum', 'annual rate', 'invested']
  work_rate:            ['how long (will|would) it take', 'working together', 'rate of work', 'jobs? in']
  averages:             ['\baverage\b', '\bmean\b', 'median', 'per day on average']
  unit_conversion:      ['convert', 'how many (inches|feet|yards|ounces|pounds|quarts|gallons|centimet|met|kilo)', 'equivalent to']
  basic_probability:    ['probability', 'chance', 'likelihood', 'at random', 'odds of']
  cost_profit:          ['profit', 'revenue', 'total cost', 'each costs?', 'per item', 'wholesale', 'retail']

MK:
  exponents_roots:      ['\^', 'squared', 'cubed', 'square root', '√', 'exponent', 'to the power']
  factoring:            ['factor', 'expand', 'simplify.*\(.*\)', '\(x\s*[\+\-]', 'trinomial', 'binomial']
  linear_equations:     ['solve for', 'value of x', '\bx\s*=', 'equation', 'if\s+\d*x']
  inequalities:         ['<', '>', '≤', '≥', 'at least', 'at most', 'inequality', 'greater than', 'less than']
  area_perimeter_volume: ['\barea\b', 'perimeter', '\bvolume\b', 'circumference', 'surface area', 'cubic', 'square (feet|inches|yards|met)']
  angles_triangles:     ['angle', 'triangle', 'degrees', 'hypotenuse', 'right triangle', 'isosceles', 'parallel lines']
  sequences:            ['sequence', 'next number', 'pattern', 'arithmetic progression', 'series']
  fractions_decimals:   ['fraction', 'decimal', '\d+/\d+', 'numerator', 'denominator', 'lowest terms']
  order_of_operations:  ['order of operations', 'parenthes', 'expression equals', 'evaluate']

WK:
  synonyms_isolation:   ['most nearly means', 'means most nearly', 'closest in meaning', 'is a synonym']
  words_in_context:     ['in the sentence', 'as used (in|above)', 'the underlined word', 'in this context']
  roots_prefixes_suffixes: ['prefix', 'suffix', 'root word', 'derived from', 'origin of the word']

